<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HyperBolt OS 3.2</title>
<style>
*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000}
body{display:flex;justify-content:center;align-items:center}
#os{position:relative;width:min(100vw,380px);height:min(100vh,780px);height:min(100dvh,780px);overflow:hidden;touch-action:none;user-select:none;color:#fff;background:var(--bg);--bg:#14141f;--ac:#ffd400;--card:#ffffff22;--win:#f4f4f8;--wf:#111}
#os.dark{--win:#16161d;--wf:#eee}
@media(min-width:420px){#os{border:8px solid #222;border-radius:34px}}
.s{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;background:var(--bg)}
.s.on{display:flex}
#boot{align-items:center;justify-content:center;background:#000;z-index:50;text-align:center;gap:6px}
#boot span{font-size:90px}#boot small{color:#888}
#lock{align-items:center;padding:56px 20px}
#t{font-size:68px;font-weight:200}#g{margin-top:6px;opacity:.9}
.c{position:absolute;bottom:44px;width:54px;height:54px;border-radius:50%;border:0;background:var(--card);color:#fff;font-size:24px}
#cam{left:24px}#tor{right:24px}
#hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;opacity:.8}
#home{padding:40px 14px 50px;overflow-y:auto;touch-action:pan-y}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 4px}
.ap{text-align:center;font-size:11px;cursor:pointer}
.ap i{display:flex;width:54px;height:54px;margin:0 auto 4px;border-radius:16px;background:var(--card);align-items:center;justify-content:center;font-style:normal;font-size:28px}
#app{z-index:20;background:var(--win);color:var(--wf)}
#app header{display:flex;justify-content:space-between;align-items:center;padding:34px 16px 10px;font-size:20px}
#ab{flex:1;overflow:auto;touch-action:pan-y;padding:12px 16px 40px}
#setup{z-index:30;padding:40px 22px 20px;overflow:auto;touch-action:pan-y}
#auth{z-index:45;background:#000d;align-items:center;justify-content:center;text-align:center;padding:24px}
#qs{position:absolute;top:0;left:0;right:0;z-index:40;background:#0f0f19f5;padding:30px 16px 14px;border-radius:0 0 24px 24px;transform:translateY(-105%);transition:transform .2s}
#qs.open{transform:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.tile{padding:13px 4px;border-radius:14px;background:#2a2a3a;text-align:center;font-size:13px;cursor:pointer}
.tile.on{background:var(--ac);color:#000}
#edge{position:absolute;top:0;left:0;right:0;height:26px;z-index:36;touch-action:none}
#bar{position:absolute;bottom:6px;left:50%;width:120px;height:5px;margin-left:-60px;border-radius:5px;background:#fff;opacity:.7;z-index:31;cursor:pointer}
#eye{position:absolute;top:0;left:0;right:0;bottom:0;z-index:60;pointer-events:none;background:#ff8a00;mix-blend-mode:multiply;opacity:0}
#flash{position:absolute;top:0;left:0;right:0;bottom:0;z-index:55;background:#fff;color:#000;display:none;align-items:center;justify-content:center;font-size:26px;text-align:center;cursor:pointer}
button{font-size:15px;border:0;border-radius:12px;padding:11px 16px;margin:4px 2px;cursor:pointer}
.b{background:var(--ac);color:#000;font-weight:700}.g{background:#8884;color:inherit}
input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid #888;border-radius:10px;font-size:15px;color:#111;background:#fff}
input[type=checkbox],input[type=radio],input[type=range]{width:auto}
label{display:block;margin:8px 0}h3{margin:10px 0 6px}
.m{font-size:13px;min-height:18px;color:#6c6}.m2{font-size:12px;opacity:.6;margin-top:8px}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}.dots span{width:8px;height:8px;border-radius:50%;background:#555}.dots .a{background:var(--ac)}
.nav{margin-top:14px}.logo{font-size:60px;text-align:center}
.pat{display:grid;grid-template-columns:repeat(3,56px);gap:14px;justify-content:center;margin:10px 0}
.pat button{width:56px;height:56px;border-radius:50%;border:2px solid #888;background:#8883;color:inherit;padding:0}.pat .s{background:var(--ac);color:#000}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.keys button{padding:15px;font-size:20px;background:#8883;color:inherit}
.big{text-align:center;min-height:38px;font-size:28px}.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #8884}
.th{display:inline-block;width:46%;height:84px;margin:2%;border-radius:14px;color:#fff;font-weight:700;padding:8px;font-size:13px;border:3px solid transparent;cursor:pointer}.th.sel{border-color:#ffd400}
video{width:100%;border-radius:12px;background:#000;min-height:280px}.fv{width:140px;height:140px;border-radius:50%;object-fit:cover;margin:8px}
.ap{word-break:break-word}.ap i svg{width:40px;height:40px}.ap i b,.ap i span{pointer-events:none}#at svg{width:24px;height:24px;vertical-align:middle}
.msg{background:#8883;padding:8px 12px;border-radius:12px;margin:5px 0;max-width:80%;word-break:break-word}.me{background:var(--ac);color:#000;margin-left:auto}
.gr3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gr3 button{height:88px;font-size:38px;background:#fff;color:#111}
.gr4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.gr4 button{height:70px;font-size:30px;background:#8883;color:inherit;padding:0}
#toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}#toast.on{opacity:1}
#shut{position:absolute;top:0;left:0;right:0;bottom:0;background:#fff;z-index:75;opacity:0;pointer-events:none}
</style></head>
<body>
<div id="os">
  <div class="s on" id="boot"><span>⚡</span><b style="font-size:22px;letter-spacing:2px">HyperBolt OS</b><small>3.2 Lite</small></div>
  <div class="s" id="setup"></div>
  <div class="s" id="lock"><div id="t"></div><div id="d"></div><div id="g"></div>
    <button class="c" id="cam">📷</button><button class="c" id="tor">🔦</button><div id="hint"></div></div>
  <div class="s" id="home"><div id="grid"></div></div>
  <div class="s" id="app"><header><b id="at"></b><button class="g" id="ax">✕</button></header><div id="ab"></div></div>
  <div class="s" id="auth"></div>
  <div id="qs"><div style="text-align:center;font-size:13px;opacity:.7">⚡ Quick settings</div><div class="tiles" id="tiles"></div>
    <div style="font-size:13px">☀ Screen dimmer <input type="range" id="bri" min="30" max="100" value="100" style="width:60%"></div>
    <div id="net" style="font-size:12px;opacity:.7;margin-top:8px"></div></div>
  <div id="flash"><div style="font-size:60px">🔦<div style="font-size:22px">Flashlight ON</div><small style="font-size:13px">Tap to turn off</small></div></div>
  <div id="shut"></div><div id="toast"></div><div id="edge"></div><div id="bar"></div><div id="eye"></div>
</div>
<script>
// ===== HyperBolt OS 3.2 Lite: one small file, no libraries =====
const $=s=>document.querySelector(s),T0=performance.now();
window.onerror=m=>{const b=$('#boot');if(b)b.insertAdjacentHTML('beforeend','<p style="color:#f66;font-size:11px;padding:8px">Error: '+m+'</p>')};

// ---- saved data (one key, one object) ----
const K='hbos3',D={done:0,step:0,lang:'English',name:'',email:'',lock:'',secret:'',face:0,fp:0,real:0,cred:'',eye:0,lvl:40,dark:1,theme:0,note:'',perm:{},inst:[],chats:{},ev:{},todo:[]};
let S;try{S=Object.assign({},D,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=Object.assign({},D)}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');

// ---- languages and themes ----
const TR={English:['Swipe up to unlock','Next','Back','Welcome to HyperBolt OS'],Hindi:['अनलॉक करने के लिए ऊपर स्वाइप करें','आगे','पीछे','HyperBolt OS में स्वागत है'],Kannada:['ಅನ್‌ಲಾಕ್ ಮಾಡಲು ಮೇಲಕ್ಕೆ ಸ್ವೈಪ್ ಮಾಡಿ','ಮುಂದೆ','ಹಿಂದೆ','HyperBolt OS ಗೆ ಸ್ವಾಗತ'],Spanish:['Desliza hacia arriba para desbloquear','Siguiente','Atrás','Bienvenido a HyperBolt OS'],French:['Balayez vers le haut','Suivant','Retour','Bienvenue sur HyperBolt OS']};
const t=i=>(TR[S.lang]||TR.English)[i];
const TH=[['Bolt','linear-gradient(160deg,#14141f,#3a3000)','#ffd400'],['Ocean','linear-gradient(160deg,#023e8a,#00b4d8)','#caf0f8'],['Sunset','linear-gradient(160deg,#6a0572,#ff7b00)','#ffe066'],['Forest','linear-gradient(160deg,#0b3d20,#52b788)','#d8f3dc'],['Candy','linear-gradient(160deg,#ff5fa2,#845ef7)','#fff3bf'],['Night','#000','#4dabf7']];
function look(){const o=$('#os');o.style.setProperty('--bg',TH[S.theme][1]);o.style.setProperty('--ac',TH[S.theme][2]);o.classList.toggle('dark',!!S.dark);$('#eye').style.opacity=S.eye?S.lvl/100:0}

// ---- screens ----
let CAM=null,TOR=null;
const on=id=>$('#'+id).classList.contains('on');
function closeApp(){$('#app').classList.remove('on');if(CAM){CAM.getTracks().forEach(x=>x.stop());CAM=null}}
function go(id){['setup','lock','home'].forEach(x=>$('#'+x).classList.toggle('on',x===id));closeApp();$('#qs').classList.remove('open')}
function tick(){const d=new Date(),h=d.getHours();$('#t').textContent=pad(h)+':'+pad(d.getMinutes());$('#d').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  $('#g').textContent=(h<12?'Good morning':h<17?'Good afternoon':'Good evening')+(S.name?', '+S.name:'')}
setInterval(tick,1000);

// ---- flashlight (real torch if the browser allows, else a white screen) ----
async function torch(onoff){$('#flash').style.display=onoff?'flex':'none';
  try{if(onoff){TOR=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});await TOR.getVideoTracks()[0].applyConstraints({advanced:[{torch:true}]})}
  else if(TOR){TOR.getTracks().forEach(x=>x.stop());TOR=null}}catch(e){}}
const torchOn=()=>$('#flash').style.display==='flex';
$('#flash').onclick=()=>{torch(false);tiles()};$('#tor').onclick=()=>torch(true);

// ---- biometrics: your phone's own face / fingerprint prompt (WebAuthn). Real only: needs https:// ----
const BIO=()=>!!(window.PublicKeyCredential&&window.isSecureContext);
async function wa(k){
  if(!BIO())return 'unsupported';
  try{if(!(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()))return 'unsupported';
    const r=n=>crypto.getRandomValues(new Uint8Array(n));
    if(k==='enroll'){const c=await navigator.credentials.create({publicKey:{challenge:r(32),rp:{name:'HyperBolt OS'},user:{id:r(16),name:S.name||'user',displayName:S.name||'user'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'}}});S.cred=btoa(String.fromCharCode(...new Uint8Array(c.rawId)));save()}
    else await navigator.credentials.get({publicKey:{challenge:r(32),userVerification:'required',allowCredentials:S.cred?[{type:'public-key',id:Uint8Array.from(atob(S.cred),c=>c.charCodeAt(0))}]:[]}});
    return 'ok'}catch(e){return /Security|NotSupported/.test(e.name)?'unsupported':'no'}}

// ---- lock: pattern, setup UI, unlock prompt ----
function pat(el,cb,lbl){let q=[];
  el.innerHTML='<div class="pat">'+[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')+`</div><div class="m" id="pm"></div><button class="b" id="po">${lbl}</button><button class="g" id="pc">Clear</button>`;
  el.querySelector('.pat').onclick=e=>{const b=e.target.closest('button');if(b&&!q.includes(b.dataset.n)){q.push(b.dataset.n);b.classList.add('s')}};
  el.querySelector('#pc').onclick=()=>{q=[];el.querySelectorAll('.pat button').forEach(b=>b.classList.remove('s'))};
  el.querySelector('#po').onclick=()=>q.length<4?el.querySelector('#pm').textContent='Use at least 4 dots':cb(q.join(''))}
function lockUI(el){let type=S.lock||'none';
  const NB='⚠ Face and fingerprint need an https:// address and a phone with face or fingerprint set up. They cannot be turned on from a downloaded file.';
  const draw=(note)=>{
    el.innerHTML='<h3>🔒 Screen lock</h3>'+['none','PIN','password','pattern'].map(x=>`<label><input type="radio" name="lk" value="${x}" ${type===x?'checked':''}> ${x}</label>`).join('')+`<div id="mk"></div><h3>Biometrics</h3><label><input type="checkbox" id="fc" ${S.face?'checked':''}> 🙂 Face unlock</label><label><input type="checkbox" id="fp" ${S.fp?'checked':''}> 👆 Fingerprint unlock</label><div class="m" id="bm">${note||''}</div><div class="m2">Uses your phone’s own biometric prompt. A PIN, password or pattern is required as a backup.</div>`;
    const bm=el.querySelector('#bm'),msg=(x,c)=>{bm.textContent=x;bm.style.color=c||'#6c6'};if(!note&&!BIO())msg(NB,'#fc6');
    el.querySelectorAll('[name=lk]').forEach(r=>r.onchange=()=>{type=r.value;if(type==='none'){S.lock='';S.secret='';S.face=S.fp=0;S.cred='';save()}draw()});
    const mk=el.querySelector('#mk');
    if(type==='PIN'||type==='password'){mk.innerHTML=`<input id="sv" type="password" placeholder="${type==='PIN'?'PIN (4+ digits)':'Password (4+ characters)'}" ${type==='PIN'?'inputmode="numeric"':''}><div class="m" id="er" style="color:#f88"></div><button class="b" id="ok">Set ${type}</button>`;
      mk.querySelector('#ok').onclick=()=>{const v=mk.querySelector('#sv').value;if(v.length<4||(type==='PIN'&&!/^\d+$/.test(v))){mk.querySelector('#er').textContent=type==='PIN'?'PIN must be 4+ digits':'Need 4+ characters';return}S.lock=type;S.secret=v;save();draw('✔ '+type+' saved')}}
    else if(type==='pattern')pat(mk,s=>{S.lock='pattern';S.secret=s;save();draw('✔ Pattern saved')},'Set pattern');
    const toggle=(key)=>async e=>{
      if(!e.target.checked){S[key]=0;if(!S.face&&!S.fp)S.cred='';save();return}
      if(!S.lock){e.target.checked=false;msg('⚠ First choose PIN, password or pattern, enter it and press Set.','#fc6');return}
      msg('Use your phone’s face or fingerprint…','#6cf');const r=await wa(S.cred?'verify':'enroll');
      if(r!=='ok'){e.target.checked=false;msg(r==='unsupported'?NB:'Cancelled or not recognised.',r==='unsupported'?'#fc6':'#f88');return}
      S[key]=1;save();msg('✔ '+(key==='face'?'Face':'Fingerprint')+' unlock on')};
    el.querySelector('#fc').onchange=toggle('face');el.querySelector('#fp').onchange=toggle('fp');
  };draw()}
function ask(ok){const a=$('#auth');a.classList.add('on');
  a.innerHTML=`<div><h3>🔒 ${S.lock==='PIN'?'Enter PIN':S.lock==='password'?'Enter password':'Draw pattern'}</h3><div id="ai"></div><div class="m" id="ae"></div>${S.face?'<button class="b" id="bf">🙂 Face</button>':''}${S.fp?'<button class="b" id="bp">👆 Fingerprint</button>':''}<button class="g" id="ac">Cancel</button></div>`;
  const ai=a.querySelector('#ai'),er=a.querySelector('#ae'),fin=()=>{a.classList.remove('on');ok()};
  if(S.lock==='pattern')pat(ai,s=>s===S.secret?fin():(er.style.color='#f88',er.textContent='Wrong pattern'),'Unlock');
  else{ai.innerHTML=`<input id="av" type="password" ${S.lock==='PIN'?'inputmode="numeric"':''} style="max-width:260px"><br><button class="b" id="ag">Unlock</button>`;ai.querySelector('#ag').onclick=()=>ai.querySelector('#av').value===S.secret?fin():(er.style.color='#f88',er.textContent='Wrong '+S.lock)}
  const bio=async()=>{er.style.color='#6cf';er.textContent='Use your phone’s face or fingerprint…';const r=await wa('verify');r==='ok'?fin():(er.style.color='#f88',er.textContent=(r==='unsupported'?'Biometrics are not available on this page.':'Not recognised.')+' Use your '+S.lock+'.')};
  const bf=a.querySelector('#bf'),bp=a.querySelector('#bp');if(bf)bf.onclick=bio;if(bp)bp.onclick=bio;
  a.querySelector('#ac').onclick=()=>a.classList.remove('on')}
const unlock=()=>S.lock?ask(()=>go('home')):go('home');
$('#hint').onclick=unlock;

// ---- eye care, themes, permissions (used by setup AND Settings) ----
function eyeUI(el){el.innerHTML=`<h3>👁 Eye care</h3><label><input type="checkbox" id="ey" ${S.eye?'checked':''}> Warm comfort filter</label><label>Strength <input type="range" id="lv" min="10" max="80" value="${S.lvl}"></label><label><input type="checkbox" id="dk" ${S.dark?'checked':''}> Dark mode</label>`;
  el.querySelector('#ey').onchange=e=>{S.eye=e.target.checked?1:0;save();look()};el.querySelector('#lv').oninput=e=>{S.lvl=+e.target.value;save();look()};el.querySelector('#dk').onchange=e=>{S.dark=e.target.checked?1:0;save();look()}}
function themeUI(el){el.innerHTML='<h3>🎨 Themes</h3>'+TH.map((x,i)=>`<div class="th ${i===S.theme?'sel':''}" data-i="${i}" style="background:${x[1]}">${x[0]}</div>`).join('');
  el.onclick=e=>{const d=e.target.closest('.th');if(d){S.theme=+d.dataset.i;save();look();themeUI(el)}}}
const PERMS=[['cam','📷 Camera'],['mic','🎤 Microphone'],['loc','📍 Location'],['not','🔔 Notifications']];
async function askPerm(k){try{
  if(k==='cam'||k==='mic'){const s=await navigator.mediaDevices.getUserMedia(k==='cam'?{video:true}:{audio:true});s.getTracks().forEach(x=>x.stop());return 1}
  if(k==='loc')return await new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(()=>r(1),()=>r(0),{timeout:15000}):r(0));
  if(k==='not')return window.Notification&&(await Notification.requestPermission())==='granted'?1:0}catch(e){}return 0}
function permUI(el,all){el.innerHTML='<h3>📲 App permissions</h3><div class="m2">Your browser will ask you to confirm each one.</div>'+PERMS.map(p=>`<label><input type="checkbox" data-p="${p[0]}" ${S.perm[p[0]]?'checked':''}> ${p[1]}</label>`).join('')+(all?'<button class="b" id="pa">Allow all</button>':'')+'<div class="m" id="pe" style="color:#f88"></div>';
  const note=x=>el.querySelector('#pe').textContent=x;
  el.querySelectorAll('[data-p]').forEach(c=>c.onchange=async()=>{const k=c.dataset.p;if(!c.checked){S.perm[k]=0;save();return}const ok=await askPerm(k);S.perm[k]=ok;c.checked=!!ok;save();note(ok?'':'Not allowed. Turn it on in your browser’s site settings.')});
  if(all)el.querySelector('#pa').onclick=async()=>{for(const p of PERMS)if(!S.perm[p[0]]){S.perm[p[0]]=await askPerm(p[0]);save()}permUI(el,all)}}

// ---- setup: shown before the phone can be used ----
const ST=[
 sb=>{sb.innerHTML=`<div class="logo">⚡</div><h2 style="text-align:center">${t(3)}</h2><h3>🌐 Language</h3><select id="ln">${Object.keys(TR).map(l=>`<option ${l===S.lang?'selected':''}>${l}</option>`).join('')}</select>`;$('#ln').onchange=e=>{S.lang=e.target.value;save();setup()}},
 sb=>{sb.innerHTML=`<h3>👤 About you</h3><input id="nm" placeholder="Your name or HyperBolt ID" value="${esc(S.name)}"><input id="em" type="email" placeholder="Email address" value="${esc(S.email)}">`;
   return()=>{const n=$('#nm').value.trim(),e=$('#em').value.trim();if(n.length<2){$('#se').textContent='Enter a name (2+ letters)';return false}if(!/^\S+@\S+\.\S+$/.test(e)){$('#se').textContent='Enter a valid email';return false}S.name=n;S.email=e;save()}},
 sb=>lockUI(sb),
 sb=>eyeUI(sb),
 sb=>themeUI(sb),
 sb=>permUI(sb,1),
 sb=>{sb.innerHTML=`<div class="logo" style="margin-top:60px">⚡</div><h2 style="text-align:center">All set, ${esc(S.name)}!</h2><p style="text-align:center">HyperBolt OS is ready.</p>`}];
function setup(){go('setup');const el=$('#setup'),n=ST.length,i=S.step;
  el.innerHTML='<div class="dots">'+ST.map((_,k)=>`<span class="${k<=i?'a':''}"></span>`).join('')+`</div><div id="sb"></div><div class="nav"><button class="g" id="bk" style="visibility:${i?'visible':'hidden'}">${t(2)}</button><button class="b" id="nx">${i===n-1?'Start ⚡':t(1)}</button></div><div class="m" id="se" style="color:#f88"></div>`;
  const chk=ST[i]($('#sb'))||(()=>1);
  $('#bk').onclick=()=>{S.step--;save();setup()};
  $('#nx').onclick=()=>{if(chk()===false)return;if(i===n-1){S.done=1;save();go('lock')}else{S.step++;save();setup()}}}

// ---- big data (photos, files) lives in IndexedDB; small settings live in localStorage ----
const DB={o(){return DB._d||(DB._d=new Promise((ok,no)=>{const r=indexedDB.open('hbos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=no}))},
 async get(k){try{const d=await DB.o();return await new Promise(r=>{const q=d.transaction('f').objectStore('f').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}},
 async set(k,v){try{const d=await DB.o();d.transaction('f','readwrite').objectStore('f').put(v,k)}catch(e){}}};
const getP=async()=>(await DB.get('photos'))||[];

function snake(b){b.innerHTML='<canvas id="sc" width="300" height="300" style="width:100%;background:#111;border-radius:12px"></canvas><div style="text-align:center;margin-top:6px"><button class="g" data-d="U">⬆</button><br><button class="g" data-d="L">⬅</button><button class="g" data-d="D">⬇</button><button class="g" data-d="R">➡</button></div><h3 id="ss" style="text-align:center">Score 0</h3><div style="text-align:center"><button class="b" id="sr">Restart</button></div>';
  const x=$('#sc').getContext('2d'),N=15,Z=20,dirs={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};let sn,dr,f,sc,dead;
  const init=()=>{sn=[[7,7]];dr=[1,0];f=[3,3];sc=0;dead=0;$('#ss').textContent='Score 0'};init();
  b.querySelectorAll('[data-d]').forEach(k=>k.onclick=()=>{const n=dirs[k.dataset.d];if(n[0]!==-dr[0]||n[1]!==-dr[1])dr=n});$('#sr').onclick=init;
  const iv=setInterval(()=>{if(!$('#sc')){clearInterval(iv);return}if(dead)return;
    const h=[(sn[0][0]+dr[0]+N)%N,(sn[0][1]+dr[1]+N)%N];
    if(sn.length>1&&sn.some(s=>s[0]===h[0]&&s[1]===h[1])){dead=1;$('#ss').textContent='Game over! Score '+sc;return}
    sn.unshift(h);if(h[0]===f[0]&&h[1]===f[1]){sc++;f=[Math.random()*N|0,Math.random()*N|0];$('#ss').textContent='Score '+sc}else sn.pop();
    x.fillStyle='#111';x.fillRect(0,0,300,300);x.font='18px sans-serif';x.fillStyle='#ffd400';x.fillText('⚡',f[0]*Z,f[1]*Z+16);x.fillStyle='#4f4';sn.forEach(s=>x.fillRect(s[0]*Z+1,s[1]*Z+1,Z-2,Z-2))},170)}
function ttt(b){let g=Array(9).fill(''),over=0;const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],win=p=>L.some(l=>l.every(i=>g[i]===p));
  const d=m=>{b.innerHTML='<div class="gr3">'+g.map((v,i)=>`<button data-i="${i}">${v}</button>`).join('')+`</div><h3 style="text-align:center">${m||'You are ❌. Your turn!'}</h3><div style="text-align:center"><button class="b" id="nw">New game</button></div>`;
    $('#nw').onclick=()=>{g=Array(9).fill('');over=0;d()};
    b.querySelector('.gr3').onclick=e=>{const i=e.target.dataset.i;if(i===undefined||g[i]||over)return;g[i]='❌';
      if(win('❌')){over=1;return d('You win! 🎉')}const em=g.map((v,j)=>v?-1:j).filter(j=>j>=0);if(!em.length){over=1;return d('Draw')}
      let mv=null;for(const p of ['⭕','❌'])for(const j of em){g[j]=p;const w=win(p);g[j]='';if(w&&mv===null)mv=j}
      if(mv===null)mv=g[4]===''?4:em[Math.floor(Math.random()*em.length)];g[mv]='⭕';
      if(win('⭕')){over=1;return d('Phone wins 🤖')}if(g.every(v=>v)){over=1;return d('Draw')}d()}};d()}

// ---- quick settings and swipes ----
function tiles(){const T=[['👁 Eye care','eye',S.eye],['🌙 Dark','dark',S.dark],['🔦 Torch','tor',torchOn()],['🔒 Lock','lock',0],['📸 Screenshot','shot',0]];
  $('#tiles').innerHTML=T.map(x=>`<div class="tile ${x[2]?'on':''}" data-k="${x[1]}">${x[0]}</div>`).join('');
  $('#net').textContent=navigator.onLine?'📶 Online':'📵 Offline'}
$('#tiles').onclick=e=>{const k=e.target.dataset.k;if(!k)return;
  if(k==='eye')S.eye=S.eye?0:1;else if(k==='dark')S.dark=S.dark?0:1;
  else if(k==='shot'){shot();return}else if(k==='tor'){torch(!torchOn());$('#qs').classList.remove('open')}else if(k==='lock'){$('#qs').classList.remove('open');go('lock')}
  save();look();tiles()};
$('#bri').oninput=e=>$('#os').style.filter=`brightness(${e.target.value}%)`;
let sy=null;const os=$('#os');
os.addEventListener('pointerdown',e=>{sy=e.clientY-os.getBoundingClientRect().top});
os.addEventListener('pointerup',e=>{if(sy===null)return;const dy=e.clientY-os.getBoundingClientRect().top-sy,q=$('#qs');
  if(q.classList.contains('open')){if(dy<-40)q.classList.remove('open')}
  else if(on('boot')||on('setup')||on('auth')){}
  else if(dy>60&&sy<130){tiles();q.classList.add('open')}
  else if(dy<-70&&on('lock')&&!on('app'))unlock();
  sy=null});

// ---- start ----
$('#hint').textContent=t(0);look();tick();
const READY=Math.round(performance.now()-T0);
setTimeout(()=>{$('#boot').classList.remove('on');S.done&&location.hash!=='#setup'?go('lock'):setup()},700);
</script>
</body></html>
